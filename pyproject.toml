[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fitplan"
version = "0.5.0"
description = "App personal local-first para ajustar entreno y alimentación con Hevy, Garmin y Fitdays"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "python-multipart>=0.0.12",
  "fitdecode>=0.10",
  "jsonschema>=4.23",
  "pyyaml>=6.0",
  "cryptography>=43",
  "keyring>=25",
  "httpx>=0.27",
  "garminconnect>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore::DeprecationWarning:fastapi.*"]
